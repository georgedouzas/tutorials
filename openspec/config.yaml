schema: spec-driven

context: |
  This repo is a Quarto website of long-form tutorials, one folder per tutorial
  at the repo root, each holding all its own artifacts: fundamentals-of-mathematics-for-physicists,
  fundamentals-of-theoretical-physics, kaluza-klein-theories, fundamentals-of-machine-learning
  and fundamentals-of-mathematics-for-machine-learning. The tutorials moved here from the
  blog repo; older changes may say "the blog" or "the site" for this website.
  Changes named physics-tutorials-* and the specs bibliography, document-build,
  figure-generation, result-verification, tutorial-content and physics-tutorials belong to
  the three physics tutorials; ml-tutorials to the two machine learning ones. Older paths
  map as follows, inside the tutorial that owns the chapter: tutorial/ is the tutorial folder,
  a chapter file part-*-NN-<slug>.qmd is <slug>/index.qmd (each page in its own folder with its
  figures/), and the reading notes (references/notes/, notes/) are Zotero child notes tagged tutorial-reading-note on each reference. Sage, Lean, Veriphy, the verification manifests and
  the check scripts were removed from the repo; shared filters are in _filters/. All other paths
  are relative to the repo root.
  Every new chapter starts from openspec/templates/chapter.qmd and every new tutorial landing
  page from openspec/templates/tutorial-index.qmd (flat chapter list, extra material such as
  software in its own section); designs and tasks that add chapters refer to these templates.

