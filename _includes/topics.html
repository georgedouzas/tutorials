<!--
Topics (openspec/changes/site-polish). Each tutorial's `categories` are its topics.
- Home page: a row of topic chips above the two tracks. Selecting chips shows the tutorials that have any selected
  topic and hides a track with none left. The selection lives in the URL hash (#topics=A,B), so it survives reloads
  and can be linked. The chips are built from the cards, so a new topic needs no edit here.
- A tutorial's landing page: the topics in its title block link to the home page filtered by that topic.
-->
<script>
(() => {
  const BROAD = ["Mathematics", "Physics", "Machine Learning"]; // shown first, in this order
  const decode = (b64) => { try { return decodeURIComponent(atob(b64)); } catch { return ""; } };
  const brand = document.querySelector("a.navbar-brand");
  const homeUrl = (brand && brand.getAttribute("href")) || "index.html";

  // Landing pages: title-block topics become links to the filtered home page.
  document.querySelectorAll(".quarto-title .quarto-categories .quarto-category").forEach((el) => {
    const t = el.textContent.trim();
    const a = document.createElement("a");
    a.className = "topic-link";
    a.textContent = t;
    a.title = `Tutorials on ${t}`;
    a.href = `${homeUrl}#topics=${encodeURIComponent(t)}`;
    el.replaceWith(a);
  });

  if (!document.body.classList.contains("home")) return;
  const cards = [...document.querySelectorAll(".quarto-listing [data-categories]")];
  if (!cards.length) return;
  const cardTopics = cards.map((c) => decode(c.getAttribute("data-categories")).split(",").filter(Boolean));
  const all = [...new Set(cardTopics.flat())];
  const topics = [...BROAD.filter((t) => all.includes(t)), ...all.filter((t) => !BROAD.includes(t))];

  const box = document.createElement("div");
  box.className = "topic-filter";
  box.innerHTML = `<div class="topic-filter-head"><span class="topic-filter-title">Filter by topic</span>
    <button type="button" class="topic-filter-clear" hidden>Clear</button>
    <span class="topic-filter-count" aria-live="polite"></span></div>
    <div class="topic-filter-list" role="group" aria-label="Filter tutorials by topic"></div>`;
  const firstTrack = document.querySelector("#quarto-document-content section.level2");
  (firstTrack ? firstTrack.parentNode : document.querySelector("#quarto-document-content"))
    .insertBefore(box, firstTrack || null);

  const list = box.querySelector(".topic-filter-list");
  const clear = box.querySelector(".topic-filter-clear");
  const count = box.querySelector(".topic-filter-count");
  const chips = topics.map((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "topic-chip" + (BROAD.includes(t) ? " topic-chip-broad" : "");
    b.textContent = t;
    b.dataset.topic = t;
    b.setAttribute("aria-pressed", "false");
    list.appendChild(b);
    return b;
  });

  const readHash = () => {
    const m = location.hash.match(/(?:^#|&)(?:topics|category)=([^&]*)/); // Quarto's own #category= links too
    return new Set(m ? m[1].split(",").map(decodeURIComponent).filter(Boolean) : []);
  };
  const writeHash = (sel) => {
    const v = [...sel].map(encodeURIComponent).join(",");
    history.replaceState(null, "", v ? `#topics=${v}` : location.pathname + location.search);
  };
  const apply = (sel) => {
    chips.forEach((b) => b.setAttribute("aria-pressed", String(sel.has(b.dataset.topic))));
    clear.hidden = sel.size === 0;
    let shown = 0;
    cards.forEach((card, i) => {
      const show = sel.size === 0 || cardTopics[i].some((t) => sel.has(t));
      card.style.display = show ? "" : "none";
      shown += show;
    });
    // hide a track that has no tutorial left
    document.querySelectorAll("#quarto-document-content section.level2").forEach((sec) => {
      const own = [...sec.querySelectorAll(".quarto-listing [data-categories]")];
      if (own.length) sec.hidden = !own.some((c) => c.style.display !== "none");
    });
    count.textContent = sel.size ? `${shown} of ${cards.length} tutorials` : "";
  };

  apply(readHash());
  window.addEventListener("hashchange", () => apply(readHash()));
  clear.addEventListener("click", () => { writeHash(new Set()); apply(new Set()); });
  list.addEventListener("click", (e) => {
    const chip = e.target.closest(".topic-chip");
    if (!chip) return;
    const sel = readHash();
    const t = chip.dataset.topic;
    sel.has(t) ? sel.delete(t) : sel.add(t);
    writeHash(sel);
    apply(sel);
  });
})();
</script>
