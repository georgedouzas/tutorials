<!--
Site script, included on every page.
- Navbar title: on a tutorial's pages it is the tutorial's title (read from the sidebar's section link) and links to
  the tutorial's landing page; on the home page it stays the site title.
- Home page: the topic filter in the left column (.home-aside). Each tutorial's `categories` are its topics.
  Selecting topics shows the tutorials that have any selected topic and hides a track with none left. The selection
  lives in the URL hash (#topics=A,B), so it survives reloads and can be linked. The topics are read from the cards,
  so a new topic needs no edit here.
-->
<script>
(() => {
  // Navbar title = the current tutorial.
  const section = document.querySelector("#quarto-sidebar .sidebar-item-section > .sidebar-item-container > a");
  const brand = document.querySelector("a.navbar-brand");
  if (section && brand) {
    const title = brand.querySelector(".navbar-title");
    if (title) title.textContent = section.textContent.trim();
    brand.setAttribute("href", section.getAttribute("href"));
  }

  if (!document.body.classList.contains("home")) return;
  const BROAD = ["Mathematics", "Physics", "Machine Learning"]; // shown first, in this order
  const decode = (b64) => { try { return decodeURIComponent(atob(b64)); } catch { return ""; } };
  const cards = [...document.querySelectorAll(".quarto-listing [data-categories]")];
  const aside = document.querySelector(".home-aside");
  if (!cards.length || !aside) return;
  const cardTopics = cards.map((c) => decode(c.getAttribute("data-categories")).split(",").filter(Boolean));
  const all = [...new Set(cardTopics.flat())];
  const topics = [...BROAD.filter((t) => all.includes(t)), ...all.filter((t) => !BROAD.includes(t)).sort()];

  const box = document.createElement("nav");
  box.className = "topic-filter";
  box.setAttribute("aria-label", "Filter tutorials by topic");
  // A <details>: always open beside the tracks; on a phone it starts folded unless topics are selected.
  box.innerHTML = `<details class="topic-filter-fold"><summary class="topic-filter-head">
    <span class="topic-filter-title">Filter by topic</span>
    <button type="button" class="topic-filter-clear" hidden>Clear</button></summary>
    <div class="topic-filter-count" aria-live="polite"></div>
    <div class="topic-filter-list" role="group"></div></details>`;
  aside.appendChild(box);
  const fold = box.querySelector("details");
  const wide = window.matchMedia("(min-width: 992px)");
  const syncFold = () => { if (wide.matches) fold.open = true; };
  wide.addEventListener("change", syncFold);
  fold.querySelector("summary").addEventListener("click", (e) => { if (wide.matches) e.preventDefault(); });

  const list = box.querySelector(".topic-filter-list");
  const clear = box.querySelector(".topic-filter-clear");
  const count = box.querySelector(".topic-filter-count");
  const chips = topics.map((t) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "topic-chip" + (BROAD.includes(t) ? " topic-chip-broad" : "");
    b.textContent = t;
    b.dataset.topic = t;
    b.setAttribute("aria-pressed", "false");
    list.appendChild(b);
    return b;
  });

  const readHash = () => {
    const m = location.hash.match(/(?:^#|&)(?:topics|category)=([^&]*)/); // Quarto's own #category= links too
    return new Set(m ? m[1].split(",").map(decodeURIComponent).filter(Boolean) : []);
  };
  const writeHash = (sel) => {
    const v = [...sel].map(encodeURIComponent).join(",");
    history.replaceState(null, "", v ? `#topics=${v}` : location.pathname + location.search);
  };
  const apply = (sel) => {
    chips.forEach((b) => b.setAttribute("aria-pressed", String(sel.has(b.dataset.topic))));
    clear.hidden = sel.size === 0;
    let shown = 0;
    cards.forEach((card, i) => {
      const show = sel.size === 0 || cardTopics[i].some((t) => sel.has(t));
      card.style.display = show ? "" : "none";
      shown += show;
    });
    // hide a track that has no tutorial left
    document.querySelectorAll("#quarto-document-content section.level2").forEach((sec) => {
      const own = [...sec.querySelectorAll(".quarto-listing [data-categories]")];
      if (own.length) sec.hidden = !own.some((c) => c.style.display !== "none");
    });
    count.textContent = sel.size ? `${shown} of ${cards.length} tutorials` : "";
  };

  const initial = readHash();
  fold.open = wide.matches || initial.size > 0;
  apply(initial);
  window.addEventListener("hashchange", () => apply(readHash()));
  clear.addEventListener("click", (e) => { e.preventDefault(); writeHash(new Set()); apply(new Set()); });
  list.addEventListener("click", (e) => {
    const chip = e.target.closest(".topic-chip");
    if (!chip) return;
    const sel = readHash();
    const t = chip.dataset.topic;
    sel.has(t) ? sel.delete(t) : sel.add(t);
    writeHash(sel);
    apply(sel);
  });
})();
</script>
