format:
  html:
    theme: [cosmo, theme.scss]
    grid:
      sidebar-width: 320px
      body-width: 760px
    toc: false
    number-sections: false
    code-copy: true
    html-math-method:
      method: katex
      url: https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/
    include-after-body:
      - _includes/topics.html
      - _includes/tutorials-nav.html

# Shared by every tutorial; the helpers live in _filters/
bibliography: references/references.bib
citeproc: false
sidebar: tutorials
page-navigation: true
shortcodes:
  - _filters/interactive.lua
filters:
  - at: pre-ast
    path: _filters/cross-references.lua
  - at: post-quarto
    path: _filters/pdf-links.lua

execute:
  cache: true
  freeze: auto
