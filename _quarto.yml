format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [cosmo, theme.scss, theme-dark.scss]
    respect-user-color-scheme: true
    grid:
      sidebar-width: 270px
      body-width: 490px
      margin-width: 230px
      gutter-width: 2rem
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    toc-location: right
    number-sections: false
    code-copy: true
    syntax-highlighting:
      light: github-light
      dark: github-dark
    html-math-method:
      method: katex
      url: https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/
    include-after-body:
      - _includes/topics.html
      - _includes/lazy-math.html

# Shared by every tutorial; the helpers live in _filters/
bibliography: references/references.bib
citeproc: false
page-navigation: true
shortcodes:
  - _filters/interactive.lua
filters:
  - at: pre-ast
    path: _filters/cross-references.lua
  - at: post-quarto
    path: _filters/pdf-links.lua

execute:
  cache: true
  freeze: auto
